name: Sync upstream & deploy to Pages

on:
  # Run every 6 hours to pick up upstream changes
  schedule:
    - cron: "0 */6 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Redeploy when the workflow itself changes
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let a running deploy finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream single-file HTML
        run: |
          set -euo pipefail
          mkdir -p _site
          curl -fsSL \
            "https://raw.githubusercontent.com/virtuan4-max/ghostlinkhub/main/ghostlinksinglefile.html" \
            -o _site/index.html
          test -s _site/index.html

      - name: Add CNAME for custom domain
        run: cp CNAME _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

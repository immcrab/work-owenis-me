<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Central</title>
<meta name="description" content="a curated hub of games and links, one click away">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <header class="hero">
    <a class="back" href="https://owenis.me">&larr; owen</a>
    <h1>Homework Central</h1>
    <p class="tagline">pick a game. open it. like it or don't.</p>
  </header>

  <section class="games" id="games">
    <p class="loading">loading games&hellip;</p>
  </section>

  <section class="games-group">
    <h2 class="section-heading">
      Unofficial <span class="badge">community-submitted</span>
      <button type="button" id="submit-open-btn" class="icon-btn" aria-haspopup="dialog" aria-controls="submit-modal" title="Add your own link">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <span>Add yours</span>
      </button>
    </h2>
    <section class="games" id="games-unofficial">
      <p class="loading">loading&hellip;</p>
    </section>
  </section>

  <div class="modal-overlay" id="submit-modal-overlay" hidden>
    <div class="modal" id="submit-modal" role="dialog" aria-modal="true" aria-labelledby="submit-modal-title">
      <div class="modal-header">
        <h2 id="submit-modal-title">Add your own</h2>
        <button type="button" class="modal-close" id="submit-close-btn" aria-label="Close">&times;</button>
      </div>
      <p class="submit-hint">Drop a link — it'll show up under Unofficial.</p>
      <form id="submit-form" class="submit-form">
        <input type="text" id="submit-name" placeholder="Name" maxlength="60" required>
        <input type="url" id="submit-url" placeholder="https://..." maxlength="500" required>
        <input type="text" id="submit-desc" placeholder="Short description (optional)" maxlength="140">
        <input type="text" id="submit-username" placeholder="By: username (optional)" maxlength="30">
        <button type="submit" id="submit-btn">Submit</button>
      </form>
      <p id="submit-status" class="submit-status" role="status" aria-live="polite"></p>
    </div>
  </div>

  <footer>
    <a href="https://owenis.me">owenis.me</a>
    <span id="year"></span>
  </footer>
</main>

<template id="game-row-template">
  <article class="game" data-slug="" role="button" tabindex="0">
    <div class="game-main">
      <h2 class="game-name"></h2>
      <p class="game-desc"></p>
    </div>
    <div class="game-actions">
      <span class="visits"><span class="visits-count">0</span> visits</span>
      <div class="votes">
        <button class="vote-btn like" type="button" aria-pressed="false">
          <span class="icon">&#9650;</span><span class="count">0</span>
        </button>
        <button class="vote-btn dislike" type="button" aria-pressed="false">
          <span class="icon">&#9660;</span><span class="count">0</span>
        </button>
      </div>
    </div>
  </article>
</template>

<script type="module" src="assets/app.js"></script>
</body>
</html>
